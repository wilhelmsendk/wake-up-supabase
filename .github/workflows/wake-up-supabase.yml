name: Wake Up Supabase

on:
  schedule:
    - cron: "0 6 * * *"   # Runs automatically every day at 06:00 UTC
  workflow_dispatch:       # Allows manual trigger from the Actions tab

jobs:
  ping-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase projects via PostgREST
        env:
          SUPABASE_PROJECTS_JSON: ${{ secrets.SUPABASE_PROJECTS_JSON }}
        run: |
          if [ -z "$SUPABASE_PROJECTS_JSON" ]; then
            echo "❌ Secret SUPABASE_PROJECTS_JSON is not set."
            echo "Go to Settings → Secrets and variables → Actions and add it."
            exit 1
          fi

          python3 -c '
          import json, os, urllib.request, urllib.error

          data = os.environ.get("SUPABASE_PROJECTS_JSON", "[]")
          try:
              projects = json.loads(data)
          except Exception as e:
              print(f"❌ Could not parse SUPABASE_PROJECTS_JSON: {e}")
              exit(1)

          print(f"📦 Found {len(projects)} Supabase project(s).\n")

          for idx, proj in enumerate(projects):
              url = proj.get("url", "").rstrip("/")
              key = proj.get("anon_key", "")
              name = proj.get("name", "")

              # Format display name (e.g. "savinghero (https://...)")
              display_name = f"{name} ({url})" if name else url

              if not url or not key:
                  print(f"⚠️ Skipping index {idx} [{name or \"unnamed\"}] — missing url or anon_key.")
                  continue

              target_url = f"{url}/rest/v1/"
              print(f"🌐 Pinging Database: {display_name}")

              req = urllib.request.Request(
                  target_url,
                  headers={
                      "apikey": key,
                      "Authorization": f"Bearer {key}"
                  }
              )

              try:
                  with urllib.request.urlopen(req) as response:
                      code = response.getcode()
                      print(f"✅ {display_name} responded with HTTP {code} — database is awake!\n")
              except urllib.error.HTTPError as e:
                  print(f"✅ {display_name} responded with HTTP {e.code} — database responded.\n")
              except Exception as e:
                  print(f"❌ Connection error for {display_name}: {e}\n")
          '
