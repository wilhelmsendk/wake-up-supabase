name: Wake Up Supabase

on:
  schedule:
    - cron: "0 6 * * *"   # runs everyday at. 06:00 UTC
  workflow_dispatch:       # Allows manual triggering under Actions

jobs:
  ping-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase projects via PostgREST
        env:
          SUPABASE_PROJECTS_JSON: ${{ secrets.SUPABASE_PROJECTS_JSON }}
        run: |
          if [ -z "$SUPABASE_PROJECTS_JSON" ]; then
            echo "❌ Secret SUPABASE_PROJECTS_JSON is not set."
            echo "Go to Settings → Secrets and variables → Actions and add it."
            exit 1
          fi

          python3 -c '
          import json, os, urllib.request, urllib.error

          data = os.environ.get("SUPABASE_PROJECTS_JSON", "[]")
          try:
              projects = json.loads(data)
          except Exception as e:
              print(f"❌ Could not parse SUPABASE_PROJECTS_JSON: {e}")
              exit(1)

          print(f"📦 Found {len(projects)} Supabase project(s).\n")

          for idx, proj in enumerate(projects):
              url = proj.get("url", "").rstrip("/")
              key = proj.get("anon_key", "")

              if not url or not key:
                  print(f"⚠️ Skipping index {idx} — missing url or anon_key.")
                  continue

              # Pings the PostgREST root endpoint. This triggers a real database query.
              target_url = f"{url}/rest/v1/"
              print(f"🌐 Pinging Database (PostgREST) via: {target_url}")

              req = urllib.request.Request(
                  target_url,
                  headers={
                      "apikey": key,
                      "Authorization": f"Bearer {key}"
                  }
              )

              try:
                  with urllib.request.urlopen(req) as response:
                      code = response.getcode()
                      print(f"✅ {url} responded with HTTP {code} — database is awake!\n")
              except urllib.error.HTTPError as e:
                  # HTTP 200/204/400/404 all indicate the database engine responded
                  print(f"✅ {url} responded with HTTP {e.code} — database responded.\n")
              except Exception as e:
                  print(f"❌ Connection error for {url}: {e}\n")
          '
